name: Liftlog
options:
  bundleIdPrefix: kr.liftlog
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: 3
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  LiftlogPersonal:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Web, Full.entitlements]
      - path: Shared
      - path: App/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.liftlog.app.ios
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PERSONAL_BUILD"
    info:
      path: Personal-Info.plist
      properties:
        CFBundleDisplayName: 리프트로그
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [liftlog]
  Liftlog:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Web, Full.entitlements]
      - path: Shared
      - path: App/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.liftlog.app.ios
    entitlements:
      path: App/Full.entitlements
      properties:
        com.apple.security.application-groups: [group.kr.liftlog.app]
    info:
      path: Full-Info.plist
      properties:
        CFBundleDisplayName: 리프트로그
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [liftlog]
    dependencies:
      - target: LiftlogWidget
  LiftlogWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.liftlog.app.ios.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.kr.liftlog.app]
    info:
      path: Widget-Info.plist
      properties:
        CFBundleDisplayName: 리프트로그 위젯
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  LiftlogPersonal:
    build:
      targets:
        LiftlogPersonal: all
  Liftlog:
    build:
      targets:
        Liftlog: all
