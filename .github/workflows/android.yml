name: Build installable APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      LIFTLOG_DEBUG_KEYSTORE: ${{ github.workspace }}/.signing/debug.keystore
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: ${{ env.LIFTLOG_DEBUG_KEYSTORE }}
          key: liftlog-explicit-debug-signing-v1
      - name: Ensure persistent signing key
        env:
          KEYSTORE_BACKUP_BASE64: ${{ secrets.LIFTLOG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .signing
          if [ -n "$KEYSTORE_BACKUP_BASE64" ]; then
            printf '%s' "$KEYSTORE_BACKUP_BASE64" | base64 --decode > "$LIFTLOG_DEBUG_KEYSTORE"
          fi
          if [ ! -s "$LIFTLOG_DEBUG_KEYSTORE" ]; then
            echo "Signing key is missing. Restore LIFTLOG_KEYSTORE_BASE64 in repository secrets; refusing to generate an incompatible key."
            exit 1
          fi
          test -s "$LIFTLOG_DEBUG_KEYSTORE"
      - name: Check workout data logic
        run: node tests/core.cjs
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Liftlog-1.3.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Liftlog-1.3.0-APK
          path: dist/Liftlog-1.3.0.apk
          if-no-files-found: error
          retention-days: 30

  interaction-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          mkdir -p /tmp/liftlog-check
          npm install --prefix /tmp/liftlog-check playwright
          /tmp/liftlog-check/node_modules/.bin/playwright install --with-deps chromium
      - name: Check mobile interactions
        env:
          NODE_PATH: /tmp/liftlog-check/node_modules
        run: |
          node tests/upgrade-ui.cjs
          node tests/polish-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Liftlog-1.3.0-Screen-Checks
          path: test-output/
  android-device-checks:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Liftlog-1.3.0-APK
          path: dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install device test runtime
        run: python3 -m pip install websocket-client --break-system-packages
      - name: Check settled keyboard, notification and enabled lock screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: python3 tests/android-device.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Liftlog-1.3.0-Android-Checks
          path: test-output/
