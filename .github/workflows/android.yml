name: Build installable APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      LIFTLOG_DEBUG_KEYSTORE: ${{ github.workspace }}/.signing/debug.keystore
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: ${{ env.LIFTLOG_DEBUG_KEYSTORE }}
          key: liftlog-explicit-debug-signing-v1
      - name: Ensure persistent signing key
        run: |
          mkdir -p .signing
          if [ ! -f "$LIFTLOG_DEBUG_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$LIFTLOG_DEBUG_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          fi
          test -s "$LIFTLOG_DEBUG_KEYSTORE"
      - name: Check workout data logic
        run: node tests/core.cjs
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Liftlog-1.2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Liftlog-1.2.0-APK
          path: dist/Liftlog-1.2.0.apk
          if-no-files-found: error
          retention-days: 30
