name: Build installable APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check workout data logic
        run: node tests/core.cjs
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build unsigned APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare unsigned distribution and signing tool
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug-unsigned.apk dist/Liftlog-1.4.1-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" dist/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Liftlog-1.4.1-Unsigned-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Sign distribution if the owner key is configured
        id: owner-signing
        env:
          LIFTLOG_NEXT_KEYSTORE_BASE64: ${{ secrets.LIFTLOG_NEXT_KEYSTORE_BASE64 }}
          LIFTLOG_NEXT_KEYSTORE_PASSWORD: ${{ secrets.LIFTLOG_NEXT_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$LIFTLOG_NEXT_KEYSTORE_BASE64" ] && [ -n "$LIFTLOG_NEXT_KEYSTORE_PASSWORD" ]; then
            umask 077
            printf '%s' "$LIFTLOG_NEXT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/liftlog-owner.p12"
            mkdir -p signed
            java -jar dist/apksigner.jar sign --ks "$RUNNER_TEMP/liftlog-owner.p12" --ks-pass env:LIFTLOG_NEXT_KEYSTORE_PASSWORD --ks-key-alias liftlog-release --out signed/Liftlog-1.4.1.apk dist/Liftlog-1.4.1-unsigned.apk
            java -jar dist/apksigner.jar verify --verbose signed/Liftlog-1.4.1.apk
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Owner signing secrets are not configured; the unsigned build must be signed with the retained owner key before distribution.'
          fi
      - uses: actions/upload-artifact@v4
        if: steps.owner-signing.outputs.signed == 'true'
        with:
          name: Liftlog-1.4.1-APK
          path: signed/Liftlog-1.4.1.apk
          retention-days: 30

  interaction-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          mkdir -p /tmp/liftlog-check
          npm install --prefix /tmp/liftlog-check playwright
          /tmp/liftlog-check/node_modules/.bin/playwright install --with-deps chromium
      - name: Check exercise notes, two-hour cap and mobile interactions
        env:
          NODE_PATH: /tmp/liftlog-check/node_modules
        run: |
          node tests/core.cjs
          node tests/upgrade-ui.cjs
          node tests/polish-ui.cjs
          node tests/exercise-edit-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Liftlog-1.4.1-Screen-Checks
          path: test-output/
  android-device-checks:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Liftlog-1.4.1-Unsigned-APK
          path: dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Sign emulator-only APK with a disposable test key
        run: |
          keytool -genkeypair -keystore /tmp/emulator-test.jks -storepass android -keypass android -alias test -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=Emulator Test'
          java -jar dist/apksigner.jar sign --ks /tmp/emulator-test.jks --ks-pass pass:android --key-pass pass:android --ks-key-alias test --out dist/Liftlog-1.4.1.apk dist/Liftlog-1.4.1-unsigned.apk
          java -jar dist/apksigner.jar verify dist/Liftlog-1.4.1.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install device test runtime
        run: python3 -m pip install websocket-client pillow --break-system-packages
      - name: Check keyboard and countdown; report OS action accessibility limits
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: python3 tests/run-android-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Liftlog-1.4.1-Android-Checks
          path: test-output/

