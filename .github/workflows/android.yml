name: Build installable APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: liftlog-debug-signing-v1
      - name: Check workout data logic
        run: node tests/core.cjs
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Liftlog-1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Liftlog-1.0.0-APK
          path: dist/Liftlog-1.0.0.apk
          if-no-files-found: error
          retention-days: 30
