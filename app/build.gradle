plugins { id 'com.android.application' }
android {
    namespace 'kr.liftlog.app'
    compileSdk 35
    defaultConfig { applicationId 'kr.liftlog.app.next'; minSdk 26; targetSdk 35; versionCode 7; versionName '1.4.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    // Distribution uses the owner's retained key; CI emits an unsigned build.
    buildTypes { debug { signingConfig null }; release { signingConfig null } }
}
