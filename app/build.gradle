plugins { id 'com.android.application' }
android {
    namespace 'kr.liftlog.app'
    compileSdk 35
    defaultConfig { applicationId 'kr.liftlog.app'; minSdk 26; targetSdk 35; versionCode 3; versionName '1.2.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        debug {
            def persistedKey = System.getenv('LIFTLOG_DEBUG_KEYSTORE')
            if (persistedKey) storeFile file(persistedKey)
        }
    }
    buildTypes { release { minifyEnabled false } }
}
